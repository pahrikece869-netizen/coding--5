<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FANTA ORANGE — Fresh & Sparkling</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>

<style>
:root{--orange:#ff6600;--orange2:#ff8c00;--glow:#ffaa33;--dark:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--dark);color:#fff;font-family:'Nunito',sans-serif;overflow-x:hidden;cursor:none}

/* CURSOR */
#cur{width:14px;height:14px;background:radial-gradient(circle,#ffaa33,#ff6600);border-radius:50%;
  position:fixed;top:0;left:0;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);
  box-shadow:0 0 16px #ff6600,0 0 36px #ff660055}
#cur2{width:38px;height:38px;border:2px solid rgba(255,102,0,.5);border-radius:50%;
  position:fixed;top:0;left:0;pointer-events:none;z-index:99998;transform:translate(-50%,-50%)}

/* LOADER */
#loader{position:fixed;inset:0;background:#ff6600;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.ltxt{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,15vw,10rem);color:#fff;
  letter-spacing:.1em;animation:lpulse .8s ease-in-out infinite alternate}
.lsub{font-size:.9rem;letter-spacing:.4em;color:rgba(255,255,255,.8);text-transform:uppercase;margin-top:-8px}
.lbar-wrap{width:200px;height:4px;background:rgba(255,255,255,.3);border-radius:10px;margin-top:28px;overflow:hidden}
.lbar{height:100%;background:#fff;border-radius:10px;animation:lbarfill 1.9s ease-in-out forwards}
.lring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.15);animation:lring 2s ease-out infinite}
@keyframes lpulse{from{text-shadow:0 0 20px rgba(0,0,0,.2)}to{text-shadow:0 0 60px rgba(255,255,255,.4)}}
@keyframes lbarfill{to{width:100%}}
@keyframes lring{0%{transform:translate(-50%,-50%) scale(.3);opacity:.8}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}

/* PARTICLES */
#pbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.pt{position:absolute;border-radius:50%;background:radial-gradient(circle,#ff660033,transparent);animation:pfloat linear infinite}
@keyframes pfloat{0%{transform:translateY(105vh) rotate(0deg);opacity:0}10%{opacity:.7}90%{opacity:.4}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

/* NAVBAR */
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:14px 40px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,10,10,.4);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,102,0,.15);transition:.3s}
.nlogo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.15em;
  background:linear-gradient(135deg,#ff8c00,#ff6600,#ffcc00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nlinks{display:flex;gap:28px;align-items:center}
.nlinks a{color:rgba(255,255,255,.8);text-decoration:none;font-weight:700;font-size:.88rem;
  letter-spacing:.06em;transition:.2s;position:relative}
.nlinks a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;
  background:var(--orange);transform:scaleX(0);transition:.2s;transform-origin:left}
.nlinks a:hover{color:var(--glow)}.nlinks a:hover::after{transform:scaleX(1)}
.nbtn{background:linear-gradient(135deg,#ff6600,#ff8c00);color:#fff;border:none;
  padding:10px 26px;border-radius:999px;font-weight:900;font-size:.88rem;letter-spacing:.08em;
  cursor:none;transition:.25s;box-shadow:0 0 20px rgba(255,102,0,.5)}
.nbtn:hover{transform:scale(1.07);box-shadow:0 0 40px rgba(255,102,0,.9)}
@media(max-width:700px){
  #nav{padding:12px 18px}.nlinks{gap:14px}.nlinks a{font-size:.75rem}
  .nlinks a:nth-child(1),.nlinks a:nth-child(2){display:none}}

/* HERO */
#hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#1e0600 0%,#0a0a0a 68%)}
.hbgtxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif;font-size:clamp(6rem,26vw,20rem);
  color:rgba(255,102,0,.055);white-space:nowrap;letter-spacing:.05em;pointer-events:none;user-select:none;line-height:1}
.hcontent{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.htag{font-family:'Bebas Neue',sans-serif;font-size:clamp(.9rem,2.5vw,1.3rem);letter-spacing:.6em;color:var(--glow);margin-bottom:6px}
.htitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,11vw,9rem);line-height:.88;
  background:linear-gradient(135deg,#ff8c00 0%,#ff6600 45%,#ffcc44 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.htitle span{display:block}
.hsub{font-size:clamp(.78rem,1.8vw,1rem);color:rgba(255,255,255,.5);letter-spacing:.22em;margin-top:10px}

/* CAN wrapper */
#canwrap{position:relative;width:clamp(220px,42vw,400px);height:clamp(320px,55vw,540px);margin:20px 0}
#can-svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:52%;filter:drop-shadow(0 0 50px rgba(255,102,0,.9));z-index:3}
.gring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:66%;padding-bottom:66%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,102,0,.38) 0%,transparent 65%);
  pointer-events:none;z-index:1;animation:gringpulse 2.6s ease-in-out infinite}
@keyframes gringpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.22);opacity:1}}
.orb-fruit{position:absolute;pointer-events:none;z-index:2}

/* CTA */
.hcta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.btnp{background:linear-gradient(135deg,#ff6600,#ff8c00);color:#fff;padding:13px 38px;
  border-radius:999px;font-weight:900;font-size:.95rem;letter-spacing:.08em;cursor:none;
  border:none;box-shadow:0 0 28px rgba(255,102,0,.6);transition:.25s}
.btnp:hover{transform:scale(1.08);box-shadow:0 0 55px rgba(255,102,0,1)}
.btno{background:transparent;border:2px solid rgba(255,102,0,.6);color:var(--glow);
  padding:13px 38px;border-radius:999px;font-weight:900;font-size:.95rem;letter-spacing:.08em;
  cursor:none;transition:.25s}
.btno:hover{background:rgba(255,102,0,.1);border-color:var(--glow);box-shadow:0 0 28px rgba(255,102,0,.3)}

/* scroll hint */
.scrhint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:7px;color:rgba(255,255,255,.35);font-size:.72rem;letter-spacing:.2em}
.sarr{width:20px;height:30px;border:2px solid rgba(255,102,0,.4);border-radius:10px;position:relative}
.sarr::after{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;background:var(--orange);border-radius:50%;animation:sdot 1.6s ease-in-out infinite}
@keyframes sdot{0%,100%{transform:translateX(-50%) translateY(0);opacity:1}to{transform:translateX(-50%) translateY(10px);opacity:0}}
.dorb{position:absolute;border-radius:50%;filter:blur(55px);pointer-events:none}

/* ABOUT */
#about{position:relative;padding:110px 0;background:linear-gradient(180deg,#0a0a0a 0%,#0e0206 50%,#0a0a0a 100%);overflow:hidden}
.about-in{max-width:1180px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
@media(max-width:760px){.about-in{grid-template-columns:1fr;gap:50px;padding:0 24px}}
#acwrap{position:relative;display:flex;align-items:center;justify-content:center;height:400px}
#acan{width:190px;filter:drop-shadow(0 0 44px rgba(255,102,0,.75))}
.aorb{position:absolute;width:75px}
.alabel{font-size:.78rem;letter-spacing:.5em;color:var(--orange);text-transform:uppercase;margin-bottom:14px}
.ahead{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,5vw,4rem);line-height:1;margin-bottom:22px;
  background:linear-gradient(135deg,#fff 0%,#ffcc66 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.abody{color:rgba(255,255,255,.62);line-height:1.9;font-size:1.03rem;margin-bottom:36px}
.abody strong{color:var(--glow)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:rgba(255,102,0,.07);border:1px solid rgba(255,102,0,.2);border-radius:16px;padding:18px;transition:.3s;backdrop-filter:blur(8px)}
.card:hover{background:rgba(255,102,0,.16);border-color:rgba(255,102,0,.5);transform:translateY(-5px);box-shadow:0 8px 30px rgba(255,102,0,.2)}
.card-ic{font-size:1.7rem;margin-bottom:7px}
.card-t{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:var(--glow);letter-spacing:.05em}
.card-s{font-size:.76rem;color:rgba(255,255,255,.4);margin-top:3px}

/* FLAVOR */
#flavor{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#flvbg{position:absolute;inset:0;background:linear-gradient(180deg,#0a0a0a 0%,#1a0500 45%,#0d0010 100%);z-index:0}
.flvin{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:100px 40px;text-align:center}
.flvlabel{font-size:.78rem;letter-spacing:.5em;color:var(--orange);text-transform:uppercase;margin-bottom:14px}
.flvbig{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,11vw,8.5rem);line-height:.88;
  background:linear-gradient(135deg,#ff8c00,#ff6600,#ffcc44);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.flvbig span{display:block}
.sdiv{width:55px;height:3px;background:linear-gradient(90deg,var(--orange),transparent);margin:22px auto;border-radius:10px}
#cratewrap{position:relative;width:300px;height:240px;margin:46px auto}
#fcan{position:absolute;top:-70px;left:50%;transform:translateX(-50%);
  width:110px;filter:drop-shadow(0 0 38px rgba(255,102,0,.95));z-index:5}
.crate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:270px;height:170px;border-radius:16px;
  background:linear-gradient(135deg,#1a0800,#2d1000);border:2px solid rgba(255,102,0,.3);
  box-shadow:0 20px 55px rgba(255,102,0,.18),inset 0 1px 0 rgba(255,140,0,.2);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.crate::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,102,0,.06) 0,rgba(255,102,0,.06) 2px,transparent 2px,transparent 42px),
             repeating-linear-gradient(0deg,rgba(255,102,0,.06) 0,rgba(255,102,0,.06) 2px,transparent 2px,transparent 42px)}
.cratelbl{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.2em;color:rgba(255,102,0,.45)}
.fpdesc{font-size:1.05rem;color:rgba(255,255,255,.58);max-width:540px;margin:0 auto;line-height:1.85}
.fpart{position:absolute;pointer-events:none;font-size:clamp(14px,2vw,22px);animation:fporbit linear infinite}
@keyframes fporbit{0%{transform:rotate(0deg) translateX(var(--r)) rotate(0deg)}100%{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}

/* FOOTER */
footer{background:#060606;border-top:1px solid rgba(255,102,0,.1);padding:56px 40px 36px;text-align:center}
.flogo{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:.2em;
  background:linear-gradient(135deg,#ff8c00,#ff6600,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.ftag{color:rgba(255,255,255,.38);font-size:.82rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:28px}
.flinks{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.flinks a{color:rgba(255,255,255,.38);text-decoration:none;font-size:.82rem;letter-spacing:.1em;transition:.2s}
.flinks a:hover{color:var(--glow)}
.fbot{font-size:.76rem;color:rgba(255,255,255,.18);letter-spacing:.15em}
.fbot span{color:var(--orange)}
.socrow{display:flex;gap:14px;justify-content:center;margin-bottom:28px}
.socbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,102,0,.3);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);
  font-size:.85rem;cursor:none;transition:.22s;text-decoration:none;font-weight:700}
.socbtn:hover{border-color:var(--orange);background:rgba(255,102,0,.15);color:var(--glow);transform:translateY(-3px)}
body::before{content:'';position:fixed;inset:0;opacity:.04;pointer-events:none;z-index:50000;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="lring" style="width:180px;height:180px;top:50%;left:50%;margin:-90px 0 0 -90px"></div>
  <div class="lring" style="width:280px;height:280px;top:50%;left:50%;margin:-140px 0 0 -140px;animation-delay:.35s"></div>
  <div class="lring" style="width:380px;height:380px;top:50%;left:50%;margin:-190px 0 0 -190px;animation-delay:.7s"></div>
  <div class="ltxt">FANTA</div>
  <div class="lsub">Loading Fresh Experience…</div>
  <div class="lbar-wrap"><div class="lbar"></div></div>
</div>

<!-- CURSOR -->
<div id="cur"></div><div id="cur2"></div>

<!-- PARTICLES -->
<div id="pbg"></div>

<!-- NAVBAR -->
<nav id="nav">
  <div class="nlogo">FANTA</div>
  <div class="nlinks">
    <a href="#hero">Home</a>
    <a href="#about">Product</a>
    <a href="#flavor">Flavor</a>
    <a href="#contact">Contact</a>
    <button class="nbtn">Buy Now</button>
  </div>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="dorb" style="width:480px;height:480px;background:#ff660020;top:5%;right:-8%"></div>
  <div class="dorb" style="width:320px;height:320px;background:#6b21a820;bottom:8%;left:-6%"></div>
  <div class="hbgtxt">FANTA</div>

  <div class="hcontent">
    <div class="htag">— Est. 1940 —</div>
    <div class="htitle"><span>FRESH</span><span>ORANGE</span></div>

    <div id="canwrap">
      <div class="gring"></div>

      <!-- Jeruk SVG inline — tidak bisa hilang -->
      <svg class="orb-fruit" id="ob1" style="width:58px;top:7%;left:9%" viewBox="0 0 80 80">
        <defs><radialGradient id="rg1" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffdd55" stop-opacity=".7"/><stop offset="100%" stop-color="#FF6600" stop-opacity="0"/></radialGradient></defs>
        <circle cx="40" cy="44" r="32" fill="#FF8000"/>
        <circle cx="40" cy="44" r="32" fill="url(#rg1)"/>
        <ellipse cx="40" cy="44" rx="32" ry="32" fill="none" stroke="rgba(255,200,0,.25)" stroke-width="1"/>
        <line x1="40" y1="16" x2="40" y2="72" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <line x1="12" y1="44" x2="68" y2="44" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <ellipse cx="30" cy="30" rx="6" ry="4" fill="rgba(255,255,255,.18)" transform="rotate(-30,30,30)"/>
        <path d="M38 12 Q42 6 46 10 Q42 14 38 12Z" fill="#16a34a"/>
        <path d="M40 12 Q40 6 44 8" stroke="#15803d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>

      <svg class="orb-fruit" id="ob2" style="width:44px;top:9%;right:7%" viewBox="0 0 80 80">
        <defs><radialGradient id="rg2" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffdd55" stop-opacity=".7"/><stop offset="100%" stop-color="#FF6600" stop-opacity="0"/></radialGradient></defs>
        <circle cx="40" cy="44" r="32" fill="#FF7700"/>
        <circle cx="40" cy="44" r="32" fill="url(#rg2)"/>
        <line x1="40" y1="16" x2="40" y2="72" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <line x1="12" y1="44" x2="68" y2="44" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <ellipse cx="30" cy="30" rx="5" ry="3.5" fill="rgba(255,255,255,.18)" transform="rotate(-30,30,30)"/>
        <path d="M38 12 Q42 6 46 10 Q42 14 38 12Z" fill="#16a34a"/>
      </svg>

      <svg class="orb-fruit" id="ob3" style="width:50px;bottom:10%;left:5%" viewBox="0 0 80 80">
        <defs><radialGradient id="rg3" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffdd55" stop-opacity=".7"/><stop offset="100%" stop-color="#FF6600" stop-opacity="0"/></radialGradient></defs>
        <circle cx="40" cy="44" r="32" fill="#FF8500"/>
        <circle cx="40" cy="44" r="32" fill="url(#rg3)"/>
        <line x1="40" y1="16" x2="40" y2="72" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <line x1="12" y1="44" x2="68" y2="44" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <ellipse cx="30" cy="30" rx="6" ry="4" fill="rgba(255,255,255,.18)" transform="rotate(-30,30,30)"/>
        <path d="M38 12 Q42 6 46 10 Q42 14 38 12Z" fill="#15803d"/>
      </svg>

      <svg class="orb-fruit" id="ob4" style="width:40px;bottom:13%;right:8%" viewBox="0 0 80 80">
        <defs><radialGradient id="rg4" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffdd55" stop-opacity=".7"/><stop offset="100%" stop-color="#FF6600" stop-opacity="0"/></radialGradient></defs>
        <circle cx="40" cy="44" r="32" fill="#FF7200"/>
        <circle cx="40" cy="44" r="32" fill="url(#rg4)"/>
        <line x1="40" y1="16" x2="40" y2="72" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <line x1="12" y1="44" x2="68" y2="44" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
        <ellipse cx="30" cy="30" rx="5" ry="3" fill="rgba(255,255,255,.18)" transform="rotate(-30,30,30)"/>
        <path d="M38 12 Q42 6 46 10 Q42 14 38 12Z" fill="#16a34a"/>
      </svg>

      <!-- KALENG FANTA SVG UTAMA -->
      <svg id="can-svg" viewBox="0 0 160 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cbody" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#9b3000"/>
            <stop offset="15%"  stop-color="#ff5500"/>
            <stop offset="40%"  stop-color="#ff8800"/>
            <stop offset="60%"  stop-color="#ff5500"/>
            <stop offset="85%"  stop-color="#cc3800"/>
            <stop offset="100%" stop-color="#8b2000"/>
          </linearGradient>
          <linearGradient id="clid" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="#888"/>
            <stop offset="35%" stop-color="#ddd"/>
            <stop offset="55%" stop-color="#fff"/>
            <stop offset="100%" stop-color="#999"/>
          </linearGradient>
          <linearGradient id="cshine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,.25)"/>
          </linearGradient>
          <linearGradient id="cshadow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="rgba(0,0,0,.25)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
          </linearGradient>
          <linearGradient id="cwavegrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#ff6600"/>
            <stop offset="100%" stop-color="#cc3300"/>
          </linearGradient>
          <clipPath id="canclip">
            <rect x="12" y="26" width="136" height="248" rx="10"/>
          </clipPath>
        </defs>

        <!-- body -->
        <rect x="12" y="26" width="136" height="248" rx="10" fill="url(#cbody)"/>

        <g clip-path="url(#canclip)">
          <!-- top silver band -->
          <rect x="12" y="26" width="136" height="24" fill="url(#clid)" opacity=".8"/>
          <!-- bottom silver band -->
          <rect x="12" y="250" width="136" height="24" fill="url(#clid)" opacity=".7"/>

          <!-- white wavy stripe -->
          <path d="M12 108 Q45 90 80 108 Q115 126 148 108 L148 118 Q115 136 80 118 Q45 100 12 118Z"
                fill="rgba(255,255,255,.18)"/>
          <path d="M12 190 Q45 172 80 190 Q115
